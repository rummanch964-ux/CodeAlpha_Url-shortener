<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>URL Shortener</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 480px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 8px;
            font-size: 28px;
        }

        p.subtitle {
            color: #888;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            font-size: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #764ba2;
        }

        button {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(118, 75, 162, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        #result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            font-size: 14px;
            min-height: 20px;
        }

        #result.success {
            background: #f0f7ff;
            border: 1px solid #cce0ff;
        }

        #result.error {
            background: #fff0f0;
            border: 1px solid #ffcccc;
            color: #cc0000;
        }

        #result a {
            color: #764ba2;
            font-weight: 600;
            text-decoration: none;
            word-break: break-all;
        }

        #result a:hover {
            text-decoration: underline;
        }

        #result small {
            display: block;
            margin-top: 6px;
            color: #888;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>🔗 URL Shortener</h2>
        <p class="subtitle">Shorten your long URLs</p>

        <div class="input-group">
            <input type="text" id="urlInput" placeholder="https://example.com/...">
            <button onclick="shortenUrl()">Shorten</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
        async function shortenUrl() {
            const url = document.getElementById('urlInput').value;
            const resultDiv = document.getElementById('result');

            if (!url) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = "Please enter a URL first";
                return;
            }

            try {
                const response = await fetch('/shorten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ original_url: url })
                });

                const data = await response.json();

                if (data.short_url) {
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `Short URL: <a href="${data.short_url}" target="_blank">${data.short_url}</a>`;
                    if (data.message) {
                        resultDiv.innerHTML += `<small>${data.message}</small>`;
                    }
                } else {
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = "Error: " + data.error;
                }
            } catch (err) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = "Something went wrong, please try again";
            }
        }

        // Enter key se bhi submit ho jaye
        document.getElementById('urlInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                shortenUrl();
            }
        });
    </script>
</body>

</html>
